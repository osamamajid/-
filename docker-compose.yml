version: '3.8'

services:
  # قاعدة بيانات PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: aqeed_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: aqeed_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aqeed_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # الخادم الخلفي Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aqeed_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword2026@postgres:5432/aqeed_db?schema=public
      JWT_SECRET: aqeed_super_secret_jwt_key_2026_contracts_system_secure_random
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost
    ports:
      - "5000:5000"
    networks:
      - aqeed_network

  # الواجهة الأمامية Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aqeed_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - aqeed_network

volumes:
  postgres_data:
    driver: local

networks:
  aqeed_network:
    driver: bridge
